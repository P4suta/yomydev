avoid-breaking-exported-api = false
msrv = "1.99.0"
cognitive-complexity-threshold = 18
too-many-arguments-threshold = 5
too-many-lines-threshold = 100

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true

doc-valid-idents = [
  "macOS",
  "MCP",
  "JSON",
  "AVFoundation",
  "CoreGraphics",
  "HID",
  "TCC",
]

disallowed-methods = [
  { path = "std::fs::write", reason = "yomydev only reads; frames and verdicts are never persisted" },
  { path = "std::fs::create_dir", reason = "yomydev only reads; frames and verdicts are never persisted" },
  { path = "std::fs::create_dir_all", reason = "yomydev only reads; frames and verdicts are never persisted" },
  { path = "std::fs::File::create", reason = "yomydev only reads; frames and verdicts are never persisted" },
  { path = "std::fs::OpenOptions::new", reason = "yomydev only reads; frames and verdicts are never persisted" },
  { path = "std::process::Command::new", reason = "yomydev observes in process and starts no tools" },
  { path = "std::process::exit", reason = "return an ExitCode from main" },
  { path = "std::env::set_var", reason = "races with other threads" },
  { path = "std::env::remove_var", reason = "races with other threads" },
  { path = "core::result::Result::ok", reason = "turns a failure into absence; match the error" },
  { path = "core::result::Result::unwrap_or_default", reason = "turns a failure into a stand-in; match the error" },
]
