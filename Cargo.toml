[workspace]
resolver = "3"
members = ["crates/yomydev-core", "crates/yomydev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/yomydev"
authors = ["yomydev contributors"]

[workspace.dependencies]
yomydev-core = { path = "crates/yomydev-core", version = "=0.1.0" }
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = [
  "std",
  "objc2",
] }
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-vision = { version = "0.3.2", default-features = false }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }
unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
float_arithmetic = "deny"
mem_forget = "deny"
exit = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
string_add = "deny"
str_to_string = "deny"
assertions_on_result_states = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
wildcard_imports = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
mod_module_files = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cargo_common_metadata = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
manual_let_else = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
